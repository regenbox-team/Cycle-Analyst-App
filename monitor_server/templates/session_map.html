<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Session Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    >
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3ec;
        --panel: #ffffff;
        --ink: #1a1a1a;
        --muted: #5f5f5f;
        --accent: #0d9488;
        --accent-soft: #d5f1ee;
        --border: #e6dfd3;
        --shadow: 0 10px 30px rgba(20, 20, 20, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        font-family: "Apfel Grotesk", "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at 10% 10%, #fff7eb 0%, #f7f3ec 45%, #efe7db 100%);
      }
      main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 48px; }
      h1 { margin: 0 0 6px 0; font-size: 28px; letter-spacing: -0.02em; }
      h2 { margin: 18px 0 10px 0; font-size: 18px; }
      .muted { color: var(--muted); font-size: 12px; letter-spacing: 0.02em; text-transform: uppercase; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 16px 18px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 12px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fffaf2;
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .btn-primary {
        background: var(--accent-soft);
        color: #0f766e;
        border-color: var(--accent);
      }
      .map {
        width: 100%;
        height: 420px;
        border-radius: 14px;
        border: 1px dashed #dacfc1;
        overflow: hidden;
      }
      .map .leaflet-container { background: #f0ede7; }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .stat {
        background: #faf6ef;
        border: 1px solid #efe3d5;
        border-radius: 12px;
        padding: 10px 12px;
      }
      .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
      .stat-value { font-size: 18px; font-weight: 700; margin-top: 6px; }
      .summary-section-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .summary-category-card {
        background: #fffdf9;
        border: 1px solid #efe3d5;
        border-radius: 8px;
        padding: 12px;
      }
      .summary-category-card h2 {
        margin: 0 0 10px 0;
        color: #111111;
        font-size: 15px;
        font-weight: 800;
      }
      .summary-metric-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .summary-column-head,
      .summary-metric-row {
        display: grid;
        grid-template-columns: minmax(5.8rem, 0.8fr) repeat(var(--summary-user-count), minmax(3.6rem, 1fr));
        gap: 6px;
        align-items: stretch;
      }
      .summary-column-head span {
        min-width: 0;
        color: #9a5a00;
        background: #fff2d6;
        border: 1px solid #f3c56e;
        border-radius: 999px;
        padding: 4px 6px;
        font-size: 10px;
        font-weight: 800;
        text-align: center;
        text-transform: uppercase;
      }
      .summary-column-head span:first-child {
        background: transparent;
        border-color: transparent;
      }
      .summary-metric-title {
        display: flex;
        align-items: center;
        min-width: 0;
        color: #d47500;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.15;
      }
      .summary-value {
        min-width: 0;
        background: #faf6ef;
        border: 1px solid #efe3d5;
        border-radius: 7px;
        padding: 6px;
        text-align: center;
      }
      .summary-value-number {
        color: var(--ink);
        font-size: 13px;
        font-weight: 800;
        line-height: 1.15;
      }
      @media (max-width: 720px) {
        main { padding: 24px 16px 40px; }
        .map { height: 320px; }
        .stats { grid-template-columns: 1fr; }
        .summary-section-grid { grid-template-columns: 1fr; }
        .summary-column-head,
        .summary-metric-row {
          grid-template-columns: minmax(4.8rem, 0.85fr) repeat(var(--summary-user-count), minmax(3.1rem, 1fr));
          gap: 5px;
        }
        .summary-metric-title { font-size: 11px; }
        .summary-value-number { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Session map</h1>
      <div class="muted">{{ device_id }} · {{ session_id }} · {{ mode }}</div>
      <div class="row">
        <a class="btn" href="/">← Back to monitor</a>
        <a class="btn btn-primary" href="{{ gpx_url }}">Download GPX</a>
      </div>
      <div class="card" style="margin-top: 16px;">
        <div id="session-map" class="map" role="img" aria-label="Session track"></div>
        <div class="stats">
          <div class="stat">
            <div class="stat-label">Start</div>
            <div class="stat-value">{{ start_ts or "-" }}</div>
          </div>
          <div class="stat">
            <div class="stat-label">End</div>
            <div class="stat-value">{{ end_ts or "-" }}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Distance</div>
            <div class="stat-value">{{ "%.2f"|format(distance_km or 0) }} km</div>
          </div>
          <div class="stat">
            <div class="stat-label">Points</div>
            <div class="stat-value">{{ rows_count or 0 }}</div>
          </div>
        </div>
        <h2>Ride summary</h2>
        {% include "partials/summary_cards.html" %}
      </div>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const mapEl = document.getElementById("session-map");
      const fallbackPoints = {{ points | tojson }};
      const gpxUrl = {{ gpx_url | tojson }};

      const parseGpx = (text) => {
        const doc = new DOMParser().parseFromString(text, "application/xml");
        return Array.from(doc.getElementsByTagName("trkseg"))
          .map((segment) => Array.from(segment.getElementsByTagName("trkpt"))
            .map((pt) => {
              const lat = Number.parseFloat(pt.getAttribute("lat"));
              const lon = Number.parseFloat(pt.getAttribute("lon"));
              if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
              const eleNode = pt.getElementsByTagName("ele")[0];
              const timeNode = pt.getElementsByTagName("time")[0];
              return {
                lat,
                lon,
                alt: eleNode ? Number.parseFloat(eleNode.textContent) : null,
                time: timeNode ? timeNode.textContent : null
              };
            })
            .filter(Boolean))
          .filter((segment) => segment.length);
      };

      const renderTrack = (segments) => {
        if (!mapEl || typeof L === "undefined") return;
        const map = L.map(mapEl, { zoomControl: true }).setView([20, 0], 2);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "© OpenStreetMap contributors"
        }).addTo(map);
        if (!segments.length) return;
        const latlngSegments = segments
          .map((points) => points.map((p) => [p.lat, p.lon]))
          .filter((points) => points.length);
        if (!latlngSegments.length) return;
        const line = L.polyline(latlngSegments, { color: "#0d9488", weight: 4 }).addTo(map);
        const firstPoint = latlngSegments[0][0];
        const lastSegment = latlngSegments[latlngSegments.length - 1];
        const lastPoint = lastSegment[lastSegment.length - 1];
        L.circleMarker(firstPoint, {
          radius: 6,
          color: "#16a34a",
          weight: 2,
          fillOpacity: 0.9
        }).addTo(map).bindTooltip("start");
        L.circleMarker(lastPoint, {
          radius: 6,
          color: "#ef4444",
          weight: 2,
          fillOpacity: 0.9
        }).addTo(map).bindTooltip("end");
        map.fitBounds(line.getBounds(), { padding: [20, 20] });
      };

      fetch(gpxUrl)
        .then((res) => res.text())
        .then((text) => renderTrack(parseGpx(text)))
        .catch(() => renderTrack([fallbackPoints]));
    </script>
  </body>
</html>
