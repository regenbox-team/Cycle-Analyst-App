<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supercycle Sun Trip</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    >
    <style>
      @font-face {
        font-family: "Apfel Grotesk";
        src: url("/static/font/ApfelGrotezk-Regular.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Apfel Grotesk";
        src: url("/static/font/ApfelGrotezk-Fett.otf") format("opentype");
        font-weight: 700 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #f2f2f2;
        --paper: #f8f8f8;
        --ink: #141414;
        --muted: #696969;
        --panel: #ffffff;
        --panel-soft: #eeeeee;
        --line: #d7d7d7;
        --line-strong: #b8b8b8;
        --marker: #151515;
        --marker-old: #767676;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: var(--bg);
        font-family: "Apfel Grotesk", "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
      }

      .page {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 18px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-end;
        padding: 8px 0 18px;
      }

      .brand {
        margin: 0;
        font-size: clamp(36px, 7vw, 92px);
        line-height: 0.9;
        font-weight: 800;
        letter-spacing: 0;
      }

      .status-block {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
        text-align: right;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.18fr) minmax(360px, 0.82fr);
        gap: 18px;
        align-items: start;
      }

      .photo-panel,
      .map-panel,
      .metric {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .photo-panel {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
      }

      .photo-panel img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        background: #dedede;
        filter: saturate(0);
      }

      .subtitle {
        font-size: 14px;
        color: var(--muted);
      }

      .time-pill {
        flex: none;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: #fff;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 14px;
        font-weight: 800;
      }

      .side {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 0;
      }

      .map-panel {
        border-radius: 8px;
        overflow: hidden;
        min-height: 420px;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--paper);
      }

      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .panel-title {
        font-size: 13px;
        color: var(--muted);
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .session {
        color: var(--ink);
        font-size: 12px;
        font-weight: 750;
        text-align: right;
      }

      #suntrip-map {
        width: 100%;
        min-height: 360px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        border-radius: 8px;
        padding: 14px 16px;
        min-height: 92px;
        background: var(--panel);
      }

      .metric-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 800;
      }

      .metric-value {
        margin-top: 8px;
        font-size: clamp(24px, 3.4vw, 42px);
        line-height: 1;
        font-weight: 800;
      }

      .metric-unit {
        margin-left: 4px;
        font-size: 14px;
        color: var(--muted);
        font-weight: 750;
      }

      .empty {
        display: grid;
        place-items: center;
        min-height: 60vh;
        color: var(--muted);
        font-weight: 750;
      }

      .leaflet-control-attribution {
        font-size: 10px;
      }

      .leaflet-tile-pane {
        filter: grayscale(1) contrast(0.92) brightness(1.04);
      }

      @media (max-width: 980px) {
        .page { padding: 12px; }
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .status-block {
          align-items: flex-start;
          text-align: left;
        }
        .hero {
          grid-template-columns: 1fr;
          min-height: 0;
        }
        .map-panel {
          min-height: 380px;
        }
        #suntrip-map {
          min-height: 310px;
        }
      }

      @media (max-width: 560px) {
        .metrics {
          grid-template-columns: 1fr;
        }
        .panel-head {
          align-items: flex-start;
          flex-direction: column;
        }
        .session {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header id="topbar" class="topbar" hidden>
        <h1 class="brand">Supercycle<br>Sun Trip</h1>
        <div class="status-block">
          <div class="time-pill" id="time-since">--</div>
          <div class="subtitle" id="captured-at">Dernière capture</div>
        </div>
      </header>
      <section id="content" class="hero" hidden>
        <article class="photo-panel">
          <img id="latest-photo" alt="Dernière photo du Supercycle">
        </article>

        <aside class="side">
          <section class="map-panel">
            <div class="panel-head">
              <div class="panel-title">Position des photos</div>
              <div class="session" id="session-label">--</div>
            </div>
            <div id="suntrip-map"></div>
          </section>

          <section class="metrics" aria-label="Métriques de session">
            <div class="metric">
              <div class="metric-label">Vitesse actuelle</div>
              <div class="metric-value"><span id="speed">--</span><span class="metric-unit">km/h</span></div>
            </div>
            <div class="metric">
              <div class="metric-label">Distance parcourue aujourd'hui</div>
              <div class="metric-value"><span id="distance">--</span><span class="metric-unit">km</span></div>
            </div>
            <div class="metric">
              <div class="metric-label">Dénivelé du jour</div>
              <div class="metric-value"><span id="uphill">--</span><span class="metric-unit">m</span></div>
            </div>
            <div class="metric">
              <div class="metric-label">Puissance solaire</div>
              <div class="metric-value"><span id="solar-power">--</span><span class="metric-unit">W</span></div>
            </div>
            <div class="metric">
              <div class="metric-label">Puissance musculaire</div>
              <div class="metric-value"><span id="generator-power">--</span><span class="metric-unit">W</span></div>
            </div>
            <div class="metric">
              <div class="metric-label">Production solaire de la journée</div>
              <div class="metric-value"><span id="solar-total">--</span><span class="metric-unit">Wh</span></div>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      let map;
      let markers = [];
      let latestImageUrl = "";

      function formatAge(seconds) {
        if (seconds == null) return "--";
        if (seconds < 60) return `il y a ${seconds}s`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `il y a ${minutes} min`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `il y a ${hours} h ${minutes % 60} min`;
        const days = Math.floor(hours / 24);
        return `il y a ${days} j ${hours % 24} h`;
      }

      function formatNumber(value, decimals = 0) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "--";
        return n.toLocaleString("fr-FR", {
          minimumFractionDigits: decimals,
          maximumFractionDigits: decimals
        });
      }

      function setText(id, value) {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      }

      function initMap() {
        if (map) return;
        map = L.map("suntrip-map", {
          scrollWheelZoom: false,
          zoomControl: true
        }).setView([46.8, 2.4], 5);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 18,
          attribution: "&copy; OpenStreetMap"
        }).addTo(map);
      }

      function renderMarkers(points) {
        initMap();
        markers.forEach(marker => marker.remove());
        markers = [];

        const bounds = [];
        points.forEach(point => {
          const marker = L.circleMarker([point.lat, point.lon], {
            radius: point.latest ? 12 : 6,
            color: point.latest ? "#111111" : "#6f6f6f",
            weight: point.latest ? 3 : 1,
            fillColor: point.latest ? "#111111" : "#8a8a8a",
            fillOpacity: point.latest ? 0.92 : 0.28,
            opacity: point.latest ? 1 : 0.46
          }).addTo(map);
          marker.bindPopup(point.latest ? "Dernière photo" : point.captured_at);
          markers.push(marker);
          bounds.push([point.lat, point.lon]);
        });

        if (bounds.length === 1) {
          map.setView(bounds[0], 13);
        } else if (bounds.length > 1) {
          map.fitBounds(bounds, { padding: [28, 28], maxZoom: 13 });
        }
      }

      async function loadSuntrip() {
        const res = await fetch("/public/suntrip.json", { cache: "no-store" });
        const data = await res.json();
        const latest = data.latest;
        document.getElementById("content").hidden = !latest;
        document.getElementById("topbar").hidden = !latest;
        if (!latest) return;

        if (latest.image_url !== latestImageUrl) {
          latestImageUrl = latest.image_url;
          document.getElementById("latest-photo").src = `${latest.image_url}?t=${encodeURIComponent(latest.uploaded_at || latest.captured_at || Date.now())}`;
        }

        setText("captured-at", latest.captured_at || "Dernière capture");
        setText("time-since", formatAge(data.seconds_since_latest));
        setText("session-label", `${latest.device_id || ""} · ${latest.session_id || ""}`);

        const metrics = latest.metrics || {};
        setText("speed", formatNumber(metrics.speed_kph, 1));
        setText("distance", formatNumber(metrics.distance_km, 1));
        setText("uphill", formatNumber(metrics.gps_uphill_m, 0));
        setText("solar-power", formatNumber(metrics.solar_power_w, 0));
        setText("generator-power", formatNumber(metrics.generator_power_w, 0));
        setText("solar-total", formatNumber(metrics.solar_wh, 1));
        renderMarkers(Array.isArray(data.points) ? data.points : []);
      }

      loadSuntrip();
      setInterval(loadSuntrip, 30000);
    </script>
  </body>
</html>
