<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All DBC Signals (Live)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
    .kv-key { color: #666; }
    .muted { color: #888; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  </head>
<body>
  <h1>All DBC Signals (Live)</h1>

  <div class="section section-compact">
    <div class="card card-wide">
      <div class="section-title">Acticycle Derived</div>
      <div id="acticycle" class="kv"></div>
    </div>
  </div>

  <div class="section">
    <div class="card card-wide">
      <div class="section-title">All Signals (Message.Signal)</div>
      <div class="muted">Sourced from latest line in <span class="mono">var/debug/all_signals.jsonl</span></div>
      <div id="signals" class="kv"></div>
    </div>
  </div>

  <script>
    function renderKV(el, obj) {
      el.innerHTML = '';
      if (!obj || Object.keys(obj).length === 0) {
        el.innerHTML = '<div class="muted">No data</div>';
        return;
      }
      const entries = Object.entries(obj);
      // Sort keys for stable display
      entries.sort((a, b) => a[0].localeCompare(b[0]));
      for (const [k, v] of entries) {
        const kEl = document.createElement('div');
        kEl.className = 'kv-key mono';
        kEl.textContent = k;
        const vEl = document.createElement('div');
        vEl.className = 'kv-value mono';
        if (typeof v === 'number') {
          vEl.textContent = Number.isInteger(v) ? v : v.toFixed(3);
        } else {
          vEl.textContent = v === null || v === undefined ? '' : String(v);
        }
        el.appendChild(kEl);
        el.appendChild(vEl);
      }
    }

    let knownNames = null; // full set of Message.Signal names from DBCs

    async function loadAllNames() {
      try {
        const res = await fetch('/debug/all_signal_names.json');
        const data = await res.json();
        if (data && Array.isArray(data.names)) {
          knownNames = data.names;
        }
      } catch (e) {
        console.warn('Failed to load all_signal_names.json', e);
      }
    }

    function renderSignals(known, latestMap) {
      const el = document.getElementById('signals');
      el.innerHTML = '';
      if (!known && (!latestMap || Object.keys(latestMap).length === 0)) {
        el.innerHTML = '<div class="muted">No data</div>';
        return;
      }
      const keys = known || Object.keys(latestMap);
      const entries = keys.map(k => [k, latestMap ? latestMap[k] : undefined]);
      entries.sort((a, b) => a[0].localeCompare(b[0]));
      for (const [k, v] of entries) {
        const kEl = document.createElement('div');
        kEl.className = 'kv-key mono';
        kEl.textContent = k;
        const vEl = document.createElement('div');
        vEl.className = 'kv-value mono';
        if (typeof v === 'number') {
          vEl.textContent = Number.isInteger(v) ? v : v.toFixed(3);
        } else if (v !== undefined && v !== null) {
          vEl.textContent = String(v);
        } else {
          vEl.innerHTML = '<span class="muted">(no value yet)</span>';
        }
        el.appendChild(kEl);
        el.appendChild(vEl);
      }
    }

    async function tick() {
      try {
        const res = await fetch('/debug/all_signals.json');
        const data = await res.json();
        renderSignals(knownNames, data.signals || {});
        renderKV(document.getElementById('acticycle'), data.acticycle || {});
      } catch (e) {
        console.error('Failed to load /debug/all_signals.json', e);
      }
    }

    setInterval(tick, 1000);
    loadAllNames().then(tick);
  </script>
</body>
</html>
