<!-- templates/live_logs.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Logs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <h1>Live logs</h1>

  <div class="section section-compact">
    <div class="card card-wide">
      <div class="section-title">Live Metrics (/metrics)</div>
      <div class="two-col">
        <div>
          <div class="subtitle muted">Raw Cycle Analyst</div>
          <div id="raw-list" class="kv"></div>
        </div>
        <div>
          <div class="subtitle muted">Calculated Metrics</div>
          <div id="calc-list" class="kv"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const rawLabels = [
      'Ah used',
      'Voltage (V)',
      'Current (A)',
      'Speed (km/h)',
      'Distance (km)',
      'Motor Temp (C)',
      'Cyclist RPM',
      'unused8',
      'unused9',
      'unused10',
      'unused11',
      'unused12',
      'Solar Ah',
      'Solar A (pedal current)',
      'Flags',
    ];

    function renderKV(el, obj) {
      el.innerHTML = '';
      if (!obj) { el.innerHTML = '<div class="muted">No data</div>'; return; }
      for (const [k, v] of Object.entries(obj)) {
        const kEl = document.createElement('div');
        kEl.className = 'kv-key';
        kEl.textContent = k;
        const vEl = document.createElement('div');
        vEl.className = 'kv-value';
        vEl.textContent = (typeof v === 'number') ? (Number.isInteger(v) ? v : v.toFixed(3)) : (v ?? '');
        el.appendChild(kEl);
        el.appendChild(vEl);
      }
    }

    function toRawMap(list) {
      if (!Array.isArray(list) || list.length < 15) return null;
      const out = {};
      for (let i = 0; i < 15; i++) out[`${i+1}. ${rawLabels[i]}`] = list[i];
      return out;
    }

    async function loadMetrics() {
      try {
        const res = await fetch('/metrics');
        const data = await res.json();
        renderKV(document.getElementById('raw-list'), toRawMap(data.raw_CA_values));
        renderKV(document.getElementById('calc-list'), data.calculated_CA_values);
      } catch (err) {
        console.error('Failed to load /metrics:', err);
      }
    }

    setInterval(loadMetrics, 1000);
    loadMetrics();
  </script>
</body>
</html>
