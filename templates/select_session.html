<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Session</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="section">
    <h1>Select a Session</h1>

    <div class="card">
      <form action="/summary" method="get" class="form-group">
        <label for="session">View Summary for Session:</label>
        <select name="session" id="session">
          {% for s in sessions %}
            <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
        {% if mode %}
          <input type="hidden" name="mode" value="{{ mode }}">
        {% endif %}
        <button type="submit">View Summary</button>
      </form>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="session-select">Manage Session(s):</label>
        <select id="session-select" multiple></select>
        <div class="session-action-row">
          <button id="upload-session-button" data-upload-selected-sessions data-mode="{{ mode or '' }}">Upload monitor</button>
          <button id="delete-session-button">Delete</button>
        </div>
        <div id="session-upload-status" class="session-upload-status" aria-live="polite"></div>
      </div>
    </div>

    <a class="dashboard-button" href="/dashboard">&larr; Back to Dashboard</a>
  </div>
  <script src="{{ url_for('static', filename='js/session_upload.js') }}"></script>
  <script src="{{ url_for('static', filename='js/select_session.js') }}"></script>

</body>
</html>
