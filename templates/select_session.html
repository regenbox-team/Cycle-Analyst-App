<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Session</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="sessions-page">

  <div class="section">
    <h1>Sessions</h1>

    <div class="card session-table-card session-list-card">
      <div class="session-table-head">
        <div>
          <h2>Historique local</h2>
          <p>Date, distance et poids de chaque session enregistree sur le Pi.</p>
        </div>
        <button id="refresh-sessions-button" type="button">Actualiser</button>
      </div>
      <div id="session-upload-status" class="session-upload-status" aria-live="polite"></div>
      <div class="session-list-wrap">
        <div id="sessions-body" class="session-list" role="list">
          <div class="session-empty">Chargement des sessions...</div>
        </div>
      </div>
    </div>

    <a class="dashboard-button session-back-button" href="/dashboard">&larr; Retour dashboard</a>
  </div>
  <script src="{{ url_for('static', filename='js/select_session.js') }}"></script>

</body>
</html>
