<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Session</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="section">
    <h1>Select a Session</h1>

    <div class="card session-table-card">
      <div class="session-table-head">
        <div>
          <h2>Sessions</h2>
          <p>Upload manually to the monitor server when the session looks correct.</p>
        </div>
        <button id="refresh-sessions-button" type="button">Refresh</button>
      </div>
      <div id="session-upload-status" class="session-upload-status" aria-live="polite"></div>
      <div class="session-table-wrap">
        <table class="session-table">
          <thead>
            <tr>
              <th>Session</th>
              <th>Distance</th>
              <th>Rows</th>
              <th>Size</th>
              <th>Monitor</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="sessions-body">
            <tr>
              <td colspan="6">Loading sessions...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <a class="dashboard-button" href="/dashboard">&larr; Back to Dashboard</a>
  </div>
  <script src="{{ url_for('static', filename='js/select_session.js') }}"></script>

</body>
</html>
