<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cycle Analyst Start</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <h1>Vehicule Dashboard</h1>

  <div class="section" style="padding-top:0;">

    {% if session_active %}
      <div class="card" style="max-width:720px;">
        <div style="text-align:center; width:100%;">
          <p>Session is currently active.</p>
          <a href="/dashboard" class="start-button">Go to Session in Progress</a>
        </div>
      </div>
    {% else %}

      <!-- Vehicle selector card with dark background and status -->
      <div class="card card-dark" id="vehicle-card" style="max-width: 820px;">
        <div class="carousel" id="vehicle-carousel">
          <div class="vehicle-title">Select Vehicle</div>
          <div class="carousel-track">
            <div class="carousel-item" data-mode="supercycle_live">
              <img src="{{ url_for('static', filename='img/start/supercyle_live.png') }}" alt="Supercycle Live">
              <div class="caption">Supercycle Live</div>
            </div>
            <div class="carousel-item" data-mode="supercycle_test">
              <img src="{{ url_for('static', filename='img/start/superycle_test.png') }}" alt="Supercycle Test">
              <div class="caption">Supercycle Test</div>
            </div>
            <div class="carousel-item" data-mode="acticycle_live">
              <img src="{{ url_for('static', filename='img/start/acticycle_live.png') }}" alt="Acticycle Live">
              <div class="caption">Acticycle Live</div>
            </div>
            <div class="carousel-item" data-mode="acticycle_test">
              <img src="{{ url_for('static', filename='img/start/acticycle_test.png') }}" alt="Acticycle Test">
              <div class="caption">Acticycle Test</div>
            </div>
          </div>
          <div class="vehicle-card-footer" id="connection-status-wrapper">
          <button id="connection-status" disabled>Checking connection...</button>
        </div>
        </div>
    
      </div>

      <!-- Start form wraps user card + external start button -->
      <form id="start-form" method="POST" action="/start_session" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <!-- User selector card -->
        <div class="card" id="user-card" style="max-width:720px;">
          <div class="form-group" style="width:100%;">
            <div class="section-title">User</div>
            <div style="display:flex; gap:0.8rem; align-items:center; justify-content:center; flex-wrap:wrap; width:100%;">
              <label><input type="radio" name="user" value="JD" checked> JD</label>
              <label><input type="radio" name="user" value="LL"> LL</label>
            </div>
          </div>
        </div>

        <!-- Start button outside of cards -->
        <div style="text-align:center; width:100%; margin: 0.4rem 0 0.8rem 0;">
          <button class="start-button" type="submit" id="start-btn" disabled>Start Session</button>
        </div>
      </form>

      <!-- Other actions card -->
      <div class="card" id="actions-card" style="max-width:820px;">
        <div style="display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap; width:100%;">
          <button class="start-button" type="button" onclick="openResumeModal()">Resume Session</button>
          <a id="link-live-logs" class="dashboard-button" href="/live_logs">🔍 View Live Logs</a>
          <a id="link-select-session" class="dashboard-button" href="/select_session">View Session Summaries</a>
          <a id="link-edit-session" class="dashboard-button" href="/edit_session">Edit Logs</a>
        </div>
      </div>

    {% endif %}

  </div>

  <div id="resume-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeResumeModal()">&times;</span>
      <h4>Select a session to resume</h4>
      <form method="POST" action="/resume_session">
        <select id="resume-session-select" name="session_id" required style="width: 100%; padding: 0.5rem; margin-top: 1rem;"></select>
        <br><br>
        <button class="dashboard-button" type="submit">Resume</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/start.js') }}"></script>
</body>
</html>
