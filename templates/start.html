<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cycle Analyst Start</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <h1>Vehicule Dashboard</h1>

  <div class="section" style="padding-top:0;">

    {% if session_active %}
      <div class="card" style="max-width:720px;">
        <div style="text-align:center; width:100%;">
          <p>Session is currently active.</p>
          <a href="/dashboard" class="start-button">Go to Session in Progress</a>
        </div>
      </div>
    {% else %}

      <!-- Vehicle selector card with dark background and status -->
      <div class="card card-dark" id="vehicle-card" style="max-width: 820px;">
        <div class="vehicle-title">Select Vehicle</div>
        <!-- Small test mode toggle, top-left -->
        <div class="vehicle-controls">
          <label class="toggle-label"><input type="checkbox" id="test-mode-toggle"> Test Mode</label>
        </div>
        <!-- Two-vehicle layout: selected centered large, unselected top-right small -->
        <div class="vehicle-select">
          <div class="vehicle-option" id="vehicle-supercycle" data-vehicle="supercycle" title="Supercycle">
            <img id="img-supercycle"
                 data-active-src="{{ url_for('static', filename='img/start/supercyle_active.png') }}"
                 data-inactive-src="{{ url_for('static', filename='img/start/supercyle_inactive.png') }}"
                 alt="Supercycle" />
          </div>
          <div class="vehicle-option" id="vehicle-acticycle" data-vehicle="acticycle" title="Acticycle">
            <img id="img-acticycle"
                 data-active-src="{{ url_for('static', filename='img/start/acticycle_active.png') }}"
                 data-inactive-src="{{ url_for('static', filename='img/start/acticycle_inactive.png') }}"
                 alt="Acticycle" />
          </div>
        </div>
        <div class="vehicle-card-footer" id="connection-status-wrapper">
          <button id="connection-status" disabled>Checking connection...</button>
        </div>
      </div>

      <!-- Start form with merged User + GPS card and big Start button -->
      <form id="start-form" method="POST" action="/start_session" style="width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="card" id="user-gps-card" style="max-width:820px;">
          <div style="width:100%; display:flex; flex-direction:column; gap:0.6rem; align-items:stretch;">
            <div class="kv" style="grid-template-columns: auto 1fr; align-items:center;">
              <div class="kv-key">Select User:</div>
              <div class="kv-val" style="display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap;">
                <label><input type="radio" name="user" value="JD" checked> JD</label>
                <label><input type="radio" name="user" value="LL"> LL</label>
              </div>
            </div>
            <div class="kv" style="grid-template-columns: auto 1fr; align-items:center;">
              <div class="kv-key">GPS Status:</div>
              <div class="kv-val"><button id="gps-status-pill" disabled>GPS: Checking...</button></div>
              <div class="kv-key">Add Route:</div>
              <div class="kv-val">
                <input type="file" id="gpx-file-input-start" accept=".gpx" style="display:none" />
                <button class="dashboard-button" id="gpx-upload-start" type="button">Upload GPX</button>
              </div>
            </div>
            <div style="margin-top:0.6rem;">
              <button class="start-button start-button-large" type="submit" id="start-btn" disabled>Start Session</button>
            </div>
          </div>
        </div>
      </form>

      <!-- Other actions card -->
      <div class="card" id="actions-card" style="max-width:820px;">
        <div style="display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap; width:100%;">
          <button class="start-button" type="button" onclick="openResumeModal()">Resume Session</button>
          <a id="link-live-logs" class="dashboard-button" href="/live_logs">🔍 View Live Logs</a>
          <a id="link-select-session" class="dashboard-button" href="/select_session">View Session Summaries</a>
          <a id="link-edit-session" class="dashboard-button" href="/edit_session">Edit Logs</a>
        </div>
      </div>

      <!-- Route upload card removed per request -->

    {% endif %}

  </div>

  <div id="resume-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeResumeModal()">&times;</span>
      <h4>Select a session to resume</h4>
      <form method="POST" action="/resume_session">
        <select id="resume-session-select" name="session_id" required style="width: 100%; padding: 0.5rem; margin-top: 1rem;"></select>
        <br><br>
        <button class="dashboard-button" type="submit">Resume</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/start.js') }}"></script>
  <script src="{{ url_for('static', filename='js/gps_status.js') }}"></script>
  <script>
    // Minimal GPX upload/erase handlers for start page
    (function(){
      function showMsg(msg, ok=true){
        let el = document.getElementById('toast-msg');
        if (!el) {
          el = document.createElement('div');
          el.id = 'toast-msg';
          el.style.position = 'fixed';
          el.style.bottom = '1rem';
          el.style.left = '50%';
          el.style.transform = 'translateX(-50%)';
          el.style.background = '#fff';
          el.style.color = '#111';
          el.style.padding = '0.5rem 0.8rem';
          el.style.borderRadius = '0.6rem';
          el.style.border = '2px solid black';
          el.style.zIndex = '1000';
          el.style.boxShadow = '0 4px 10px rgba(0,0,0,0.4)';
          document.body.appendChild(el);
        }
        el.textContent = msg;
        el.style.color = ok ? '#111' : '#900';
        el.style.borderColor = ok ? 'black' : '#900';
        el.style.display = '';
        clearTimeout(el._hideTimer);
        el._hideTimer = setTimeout(()=>{ el.style.display='none'; }, 3000);
      }
      const upBtn = document.getElementById('gpx-upload-start');
      const erBtn = document.getElementById('gpx-erase-start');
      const fileInput = document.getElementById('gpx-file-input-start');
      if (upBtn && fileInput) {
        upBtn.addEventListener('click', (e)=> { e.preventDefault(); fileInput.click(); });
        fileInput.addEventListener('change', async ()=>{
          const f = fileInput.files && fileInput.files[0];
          if (!f) return;
          const form = new FormData();
          form.append('file', f);
          try {
            const res = await fetch('/gpx/upload', { method:'POST', body: form });
            const data = await res.json();
            if (res.ok && data.status === 'ok') showMsg(data.message || 'Uploaded'); else showMsg(data.error || 'Upload failed', false);
          } catch(e){ showMsg('Upload error', false); }
          fileInput.value = '';
        });
      }
      if (erBtn) {
        erBtn.addEventListener('click', async ()=>{
          try {
            const res = await fetch('/gpx/erase', { method:'POST' });
            const data = await res.json();
            if (res.ok) showMsg('Track erased'); else showMsg(data.error || 'Erase failed', false);
          } catch(e){ showMsg('Erase error', false); }
        });
      }
    })();
  </script>
</body>
</html>
