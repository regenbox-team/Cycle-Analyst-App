<!-- summary.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Summary</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="summary-page">
  <main class="summary-shell">
    <header class="summary-header">
      <div>
        <div class="summary-kicker">Session Summary</div>
        <h1>{{ session_id }}</h1>
      </div>
      <div class="summary-actions">
        <button
          type="button"
          data-upload-session="{{ session_id }}"
          data-mode="{{ mode or '' }}"
        >Upload monitor</button>
        <a class="dashboard-button" href="/">New session</a>
      </div>
    </header>
    <div id="session-upload-status" class="session-upload-status" aria-live="polite"></div>

    {% include "partials/summary_cards.html" %}
  </main>
  <script src="{{ url_for('static', filename='js/session_upload.js') }}"></script>
</body>
</html>
