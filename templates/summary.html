<!-- summary.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Summary</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="summary-page">
  <main class="summary-shell">
    <header class="summary-header">
      <div>
        <div class="summary-kicker">Session Summary</div>
        <h1>{{ session_id }}</h1>
      </div>
      <a class="dashboard-button" href="/">New session</a>
    </header>

    <div class="summary-section-grid">
      {% for section in sections %}
        <section class="summary-category-card">
          <h2>{{ section["category"] }}</h2>
          <div class="summary-metric-list">
            <div class="summary-column-head" style="--summary-user-count: {{ users|length }};">
              <span></span>
              {% for user in users %}
                <span>{{ user }}</span>
              {% endfor %}
            </div>
            {% for row in section["rows"] %}
              <div class="summary-metric-row" style="--summary-user-count: {{ users|length }};">
                <div class="summary-metric-title">{{ row["label"] }}</div>
                {% for item in row["values"] %}
                  <div class="summary-value">
                    <span class="summary-value-number">{{ item["value"] }}</span>
                  </div>
                {% endfor %}
              </div>
            {% endfor %}
          </div>
        </section>
      {% endfor %}
    </div>
  </main>
</body>
</html>
